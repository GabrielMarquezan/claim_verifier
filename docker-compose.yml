services:
  db:
    image: pgvector/pgvector:pg18
    container_name: claim_verifier_db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  ml:
    build: ./ml
    container_name: claim_verifier_ml

  api:
    build: ./app/api
    container_name: claim_verifier_api

    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started
    environment:
      DATABASE_URL: 'postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable'
      RAG_WORKER_ADDR: 'http://ml:8000'
      MIGRATIONS_DIR_PATH: "/usr/src/app/db/migrations"
    ports:
      - "3000:3000" 

volumes:
  postgres_data: